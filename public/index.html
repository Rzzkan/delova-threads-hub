<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Delova Threads Hub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%238a4b38'/><text x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='Georgia'>D</text></svg>" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="login" class="login hidden">
    <form id="loginForm" class="card login-card">
      <div class="logo">D</div>
      <h1>Delova Threads Hub</h1>
      <p class="muted">Kelola Threads Wardrobe, Kids, Scarf &amp; Daily dalam satu tempat.</p>
      <label>Email<input name="email" type="email" required autocomplete="username" /></label>
      <label>Password<input name="password" type="password" required autocomplete="current-password" /></label>
      <button class="btn primary" type="submit">Masuk</button>
      <p id="loginErr" class="err"></p>
    </form>
  </div>

  <div id="app" class="app hidden">
    <aside class="side">
      <div class="brandmark"><span class="logo sm">D</span><b>Threads Hub</b></div>
      <nav id="nav"></nav>
      <div class="side-foot">
        <div id="who" class="muted small"></div>
        <button id="logout" class="btn ghost small">Keluar</button>
      </div>
    </aside>
    <main>
      <div id="banner"></div>
      <div id="view"></div>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js" defer></script>
</body>
</html>
