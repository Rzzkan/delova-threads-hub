# Untuk VPS yang reverse proxy-nya nginx di host (bukan di dalam Docker).
# Salin ke /etc/nginx/sites-available/threads.delova.id lalu:
#   sudo ln -s /etc/nginx/sites-available/threads.delova.id /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d threads.delova.id        # pasang HTTPS (certbot menambah blok 443 otomatis)

server {
    listen 80;
    listen [::]:80;
    server_name threads.delova.id;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoint MCP untuk konektor Claude: jangan di-buffer, beri waktu baca lebih panjang
    location /mcp {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
